<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Outer Focus Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-opacity="0.25" stroke-dasharray="24 16" />
  <!-- Mid Target Ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#FFFFFF" stroke-width="20" stroke-opacity="0.75" />
  <!-- Central Spark / Star -->
  <path d="M 256 160 C 256 220 280 256 352 256 C 280 256 256 292 256 352 C 256 292 232 256 160 256 C 232 256 256 220 256 160 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
  <!-- Sub-satellite spark -->
  <circle cx="360" cy="150" r="18" fill="#FDE047" />
  <circle cx="150" cy="350" r="12" fill="#FFFFFF" fill-opacity="0.8" />
</svg>
